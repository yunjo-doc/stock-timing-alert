services:
  - type: web
    name: stock-timing-alert
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      - key: KAKAO_ENABLED
        value: "false"
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_ACCESS_TOKEN
        sync: false
      - key: KAKAO_REFRESH_TOKEN
        sync: false
