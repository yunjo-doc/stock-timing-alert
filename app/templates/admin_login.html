<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 — AlphaTiming</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>AlphaTiming Admin</h1>
  </div>
  <nav>
    <a href="/">Dashboard</a>
  </nav>
</div>

<div class="wrap" style="max-width:420px">
  <div class="section-title" style="margin-top:40px">관리자 로그인</div>
  <div class="glass panel fade-in">
    {% if error %}
    <div style="color:var(--danger); font-size:12.5px; margin-bottom:14px;">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <div style="margin-bottom:12px;">
        <input type="text" name="email" placeholder="이메일" required style="width:100%">
      </div>
      <div style="margin-bottom:12px;">
        <input type="password" name="password" placeholder="비밀번호" required style="width:100%">
      </div>
      <div style="margin-bottom:16px;">
        <input type="text" name="admin_code" placeholder="관리자 코드 (최초 1회만 필요)" style="width:100%">
      </div>
      <button type="submit" style="width:100%">로그인</button>
    </form>
    <div style="margin-top:16px; font-size:12px; color:var(--muted); line-height:1.6;">
      일반 회원가입과 같은 이메일/비밀번호를 사용합니다. 계정이 아직 관리자가 아니면
      Render 환경변수 <code>ADMIN_TOKEN</code> 값을 "관리자 코드"에 한 번만 입력해
      관리자 권한을 부여받으세요. 이후에는 이메일/비밀번호만으로 로그인됩니다.
      계정이 없으면 먼저 <a href="/signup" style="color:var(--secondary)">회원가입</a>해주세요.
    </div>
  </div>
</div>

</body>
</html>
