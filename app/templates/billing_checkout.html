<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드 등록 — AlphaTiming</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/png" href="/static/logo.png">
<script src="https://js.tosspayments.com/v1/payment"></script>
</head>
<body>

<div class="topbar">
  <a href="/" class="brand">
    <img src="/static/logo.png" alt="AlphaTiming" class="brand-logo">
    <h1>AlphaTiming</h1>
  </a>
  <nav>
    <a href="/pricing">요금제</a>
  </nav>
</div>

<div class="wrap" style="max-width:480px">
  <div class="section-title" style="margin-top:40px">결제 카드 등록</div>
  <div class="glass panel fade-in">
    <div style="font-size:13px; color:var(--muted); margin-bottom:4px;">선택한 플랜</div>
    <div style="font-size:16px; font-weight:700; margin-bottom:16px;">
      {{ plan.name }} — {{ '{:,}'.format(plan.price) }}원 / 월
    </div>
    <div style="font-size:12.5px; color:var(--muted); line-height:1.7; margin-bottom:20px;">
      아래 버튼을 누르면 Toss Payments 카드 등록 화면으로 이동합니다.
      등록 완료 시 첫 결제({{ '{:,}'.format(plan.price) }}원)가 즉시 청구되고,
      이후 매월 자동으로 결제됩니다.
    </div>
    <div id="payErr" style="display:none; color:var(--danger); font-size:12.5px; margin-bottom:14px;"></div>
    <button type="button" id="registerBtn" style="width:100%">카드 등록하고 구독 시작</button>
  </div>
  <div class="footer-note">결제 정보는 Toss Payments에 안전하게 저장되며, 이 서버는 카드번호를 직접 저장하지 않습니다.</div>
</div>

<script>
const tossPayments = TossPayments("{{ client_key }}");

document.getElementById('registerBtn').addEventListener('click', () => {
  tossPayments.requestBillingAuth('카드', {
    customerKey: "{{ customer_key }}",
    successUrl: "{{ success_url }}",
    failUrl: "{{ fail_url }}",
  }).catch((err) => {
    const box = document.getElementById('payErr');
    box.style.display = 'block';
    box.textContent = err.message || '카드 등록 중 오류가 발생했습니다.';
  });
});
</script>

</body>
</html>
