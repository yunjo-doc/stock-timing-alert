<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>추가 정보 입력 — AlphaTiming</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/png" href="/static/logo.png">
</head>
<body>

<div class="topbar">
  <a href="/" class="brand">
    <img src="/static/logo.png" alt="AlphaTiming" class="brand-logo">
    <h1>AlphaTiming</h1>
  </a>
</div>

<div class="wrap" style="max-width:420px">
  <div class="section-title" style="margin-top:40px">추가 정보 입력</div>
  <div class="glass panel fade-in">
    <div style="font-size:12.5px; color:var(--muted); line-height:1.6; margin-bottom:18px;">
      카카오 계정에는 이름·전화번호가 없어서 저희 쪽에서 따로 받고 있어요.
      매수/매도 알림을 정확히 보내드리기 위해 필요하니 입력 후 계속 진행해주세요.
    </div>
    {% if error %}
    <div style="color:var(--danger); font-size:12.5px; margin-bottom:14px;">{{ error }}</div>
    {% endif %}
    <form method="post" action="/complete-profile">
      <div style="margin-bottom:12px;">
        <input type="text" name="name" placeholder="이름" required style="width:100%">
      </div>
      <div style="margin-bottom:16px;">
        <input type="text" name="phone" placeholder="전화번호 (예: 010-1234-5678)" required style="width:100%">
      </div>
      <button type="submit" style="width:100%">계속하기</button>
    </form>
  </div>
</div>

</body>
</html>
