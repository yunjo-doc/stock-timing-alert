<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 — AlphaTiming</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>AlphaTiming Admin</h1>
  </div>
  <nav>
    <a href="/">Dashboard</a>
  </nav>
</div>

<div class="wrap" style="max-width:420px">
  <div class="section-title" style="margin-top:40px">관리자 로그인</div>
  <div class="glass panel fade-in">
    {% if error %}
    <div style="color:var(--danger); font-size:12.5px; margin-bottom:14px;">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <div style="margin-bottom:16px;">
        <input type="text" name="token" placeholder="관리자 토큰 (ADMIN_TOKEN)" required style="width:100%">
      </div>
      <button type="submit" style="width:100%">로그인</button>
    </form>
  </div>
</div>

</body>
</html>
