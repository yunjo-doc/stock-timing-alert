<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관심종목 관리</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>투자 타이밍 알리미</h1>
  </div>
  <nav>
    <a href="/">대시보드</a>
    <a href="/watchlist" class="active">관심종목</a>
    <a href="/notifications">알림이력</a>
  </nav>
</div>

<div class="wrap">
  <div class="panel">
    <form class="form-row" action="/watchlist/add" method="post">
      <input type="text" name="code" placeholder="종목코드 (예: 005930)" required>
      <input type="text" name="name" placeholder="종목명 (예: 삼성전자)" required>
      <button type="submit">추가</button>
    </form>

    <table>
      <thead>
        <tr><th>종목코드</th><th>종목명</th><th></th></tr>
      </thead>
      <tbody>
        {% for s in watch_list %}
        <tr>
          <td class="mono">{{ s.code }}</td>
          <td>{{ s.name }}</td>
          <td>
            <form action="/watchlist/remove" method="post" style="display:inline">
              <input type="hidden" name="code" value="{{ s.code }}">
              <button type="submit" class="danger">삭제</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="footer-note">
    종목코드는 네이버 금융 기준 6자리 숫자 코드입니다 (예: 삼성전자 005930).
    추가/삭제는 즉시 반영되며, 다음 자동분석 사이클부터 적용됩니다.
  </div>
</div>

</body>
</html>
