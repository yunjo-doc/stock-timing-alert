<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 — AlphaTiming</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>AlphaTiming</h1>
  </div>
  <nav>
    <a href="/">Dashboard</a>
  </nav>
</div>

<div class="wrap" style="max-width:420px">
  <div class="section-title" style="margin-top:40px">회원가입</div>
  <div class="glass panel fade-in">
    {% if error %}
    <div style="color:var(--danger); font-size:12.5px; margin-bottom:14px;">{{ error }}</div>
    {% endif %}
    <form method="post" action="/signup">
      <div style="margin-bottom:12px;">
        <input type="text" name="email" placeholder="이메일" required style="width:100%">
      </div>
      <div style="margin-bottom:12px;">
        <input type="password" name="password" placeholder="비밀번호 (6자 이상)" required style="width:100%">
      </div>
      <div style="margin-bottom:16px;">
        <input type="password" name="password2" placeholder="비밀번호 확인" required style="width:100%">
      </div>
      <button type="submit" style="width:100%">가입하기</button>
    </form>
    <div style="margin-top:16px; font-size:12.5px; color:var(--muted);">
      이미 계정이 있으신가요? <a href="/login" style="color:var(--secondary)">로그인</a>
    </div>
  </div>
</div>

</body>
</html>
