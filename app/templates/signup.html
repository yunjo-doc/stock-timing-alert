<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 — AlphaTiming</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/png" href="/static/logo.png">
<style>
.auth-page {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding: 40px 20px 60px;
}
.auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.auth-logo-text { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; color: var(--text); }
.auth-tagline {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 32px;
}
.auth-card { width: 100%; max-width: 380px; padding: 28px 26px; }
.auth-card h2 { font-size: 19px; margin: 0 0 4px; text-align: center; }
.auth-card .auth-sub { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0 0 22px; }
.auth-links { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 16px; }
.auth-links a { color: var(--secondary); text-decoration: none; }
@media (max-width: 420px) { .auth-card { padding: 22px 18px; } }
</style>
</head>
<body>

<div class="auth-page">
  <a href="/" class="auth-logo fade-in" style="text-decoration:none;">
    <img src="/static/logo.png" alt="AlphaTiming" width="34" height="34" style="border-radius:8px;">
    <span class="auth-logo-text">AlphaTiming</span>
  </a>
  <p class="auth-tagline fade-in">AI 기반 투자 타이밍 분석 플랫폼</p>

  <div class="glass auth-card fade-in">
    <h2>무료로 시작하기</h2>
    <p class="auth-sub">카카오 계정으로 3초 만에 가입하세요</p>

    {% if error %}
    <div style="color:var(--danger); font-size:12.5px; margin-bottom:14px; text-align:center;">{{ error }}</div>
    {% endif %}

    <a href="/auth/kakao/login" class="social-btn kakao">💬 카카오로 3초 가입</a>

    <div class="divider"><span>또는 이메일로 가입</span></div>

    <form method="post" action="/signup">
      <div style="margin-bottom:12px;">
        <input type="text" name="name" placeholder="이름" required style="width:100%">
      </div>
      <div style="margin-bottom:12px;">
        <input type="text" name="phone" placeholder="전화번호 (예: 010-1234-5678)" required style="width:100%">
      </div>
      <div style="margin-bottom:12px;">
        <input type="text" name="email" placeholder="이메일" required style="width:100%">
      </div>
      <div style="margin-bottom:12px;">
        <input type="password" name="password" placeholder="비밀번호 (6자 이상)" required style="width:100%">
      </div>
      <div style="margin-bottom:16px;">
        <input type="password" name="password2" placeholder="비밀번호 확인" required style="width:100%">
      </div>
      <button type="submit" style="width:100%">이메일로 가입하기</button>
    </form>

    <div class="auth-links">이미 계정이 있으신가요? <a href="/login">로그인</a></div>
  </div>
</div>

</body>
</html>
