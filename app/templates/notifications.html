<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알림 — AlphaTiming</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/png" href="/static/logo.png">
</head>
<body>

<div class="topbar">
  <a href="/" class="brand">
    <img src="/static/logo.png" alt="AlphaTiming" class="brand-logo">
    <h1>AlphaTiming</h1>
  </a>
  <button class="nav-toggle" onclick="this.nextElementSibling.classList.toggle('open')">☰</button>
  <nav>
    <a href="/">대시보드</a>
    <a href="/watchlist">관심종목</a>
    <a href="/notifications" class="active">알림</a>
    <a href="/pricing">요금제</a>
    {% if user %}
    <a href="/account">{{ user.email }}</a>
    {% else %}
    <a href="/login">로그인</a>
    {% endif %}
  </nav>
</div>

<div class="wrap">
  <div class="section-title" style="margin-top:0"><span class="n">·</span> 알림 이력</div>

  <div class="glass table-card fade-in">
    <table>
      <thead>
        <tr><th class="mono">시각</th><th>종목</th><th>카카오전송</th><th>메시지</th></tr>
      </thead>
      <tbody>
        {% for n in items %}
        <tr>
          <td class="mono">{{ n.created_at[:19] }}</td>
          <td class="ticker">{{ n.code }}</td>
          <td>{{ "✅" if n.sent_via_kakao else "—" }}</td>
          <td style="white-space:pre-wrap; font-size:12px; color:var(--muted)">{{ n.message }}</td>
        </tr>
        {% else %}
        <tr><td colspan="4" style="color:var(--muted)">아직 알림 이력이 없습니다.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
